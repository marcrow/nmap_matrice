[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segowl"
version = "0.2.0"
description = "Network segmentation testing: nmap scans -> segmentation matrices, Mermaid graphs, offline HTML report"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]  # uv installs it by default: `uv run pytest`

[project.scripts]
segowl = "segowl.cli:main"

[tool.setuptools]
packages = ["segowl", "segowl.render"]

[tool.setuptools.package-data]
segowl = ["assets/*", "assets/tutorial/*", "defaults/*", "kits/*/*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

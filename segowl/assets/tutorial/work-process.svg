      <circle cx="899" cy="16" r="11" fill="#0B1F33"/><text x="899" y="20" text-anchor="middle" fill="#fff" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:12px">6</text>
      
      <g transform="translate(935 54)"><rect x="-30" y="-20" width="26" height="26" rx="3" fill="#fff" stroke="#0B1F33" stroke-width="1.6"/><rect x="-27" y="-17" width="9" height="9" fill="#dcf5e3"/><rect x="-16" y="-17" width="9" height="9" fill="#fbe0e0"/><rect x="-27" y="-6" width="9" height="9" fill="#fff3d6"/><rect x="-16" y="-6" width="9" height="9" fill="#dcf5e3"/>
      <path d="M0 -8H8" stroke="#FFB020" stroke-width="2.4" marker-end="url(#fa)"/><path d="M12 -22H26L32 -16V20H12Z" fill="#fff" stroke="#0B1F33" stroke-width="1.8"/><path d="M16 -8H28M16 -2H28M16 4H24" stroke="#6B7C93" stroke-width="1.6"/><rect x="16" y="9" width="12" height="7" fill="#00C8FF" opacity=".6"/></g><text x="935" y="114" text-anchor="middle" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:13px;fill:#0B1F33">Matrices &amp; diagrams</text><text x="935" y="131" text-anchor="middle" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:400;font-size:11px;fill:#6B7C93">per client, per target set</text><text x="595" y="152" text-anchor="middle" fill="#7a4a00" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:400;font-size:11px">drop the results on each Source: matrices and diagrams regenerate by themselves</text>

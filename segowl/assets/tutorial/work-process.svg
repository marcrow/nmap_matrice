<svg xmlns="http://www.w3.org/2000/svg" width="1044" height="180" viewBox="-12 -12 1044 180" role="img" aria-label="SegOWL work process in six steps">
<title>SegOWL work process in six steps</title>
<rect x="-12" y="-12" width="1044" height="180" rx="10" fill="#fff"/>
<defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7C93"/></marker></defs><rect x="41" y="8" width="88" height="84" rx="14" fill="#E6EDF5" stroke="#d9e1ea" stroke-width="1" />
      <circle cx="49" cy="16" r="11" fill="#0B1F33"/><text x="49" y="20" text-anchor="middle" fill="#fff" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:12px">1</text>
      
      <g transform="translate(85 54)"><rect x="-26" y="-20" width="52" height="40" rx="4" fill="#fff" stroke="#0B1F33" stroke-width="2"/><path d="M-26 -8H26M-26 4H26M-8 -20V20" stroke="#0B1F33" stroke-width="1.6"/><rect x="-26" y="-20" width="52" height="12" fill="#00C8FF" opacity=".35"/></g><text x="85" y="114" text-anchor="middle" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:13px;fill:#0B1F33">Define the inventory</text><text x="85" y="131" text-anchor="middle" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:400;font-size:11px;fill:#6B7C93">IPs and Zones; names optional</text><path d="M135 50H205" stroke="#6B7C93" stroke-width="2.5" marker-end="url(#fa)"/><rect x="211" y="8" width="88" height="84" rx="14" fill="#E6EDF5" stroke="#d9e1ea" stroke-width="1" />
      <circle cx="219" cy="16" r="11" fill="#0B1F33"/><text x="219" y="20" text-anchor="middle" fill="#fff" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:12px">2</text>
      

      <circle cx="389" cy="16" r="11" fill="#0B1F33"/><text x="389" y="20" text-anchor="middle" fill="#fff" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:12px">3</text>

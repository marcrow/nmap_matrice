      <circle cx="729" cy="16" r="11" fill="#0B1F33"/><text x="729" y="20" text-anchor="middle" fill="#fff" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:12px">5</text>
      <text x="805" y="22" text-anchor="end" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-style:italic;font-size:10px;fill:#7a4a00">optional</text>
